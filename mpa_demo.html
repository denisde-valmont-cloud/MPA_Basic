      <div class="muted" style="font-size:12px;margin-bottom:10px">Montant engagé : <b>${eur(d.total)}</b>. Le reliquat retourne au disponible de l'assuré-aidant (F-22). ${GM.conf?"<b>Le service fait sera confirmé pour le compte de l'assuré-aidant (motif requis).</b>":""}</div>
      <div class="row">
        <div class="f" style="flex:0 1 160px"><label>Montant payé (€)</label><input class="in" id="gm-montant" placeholder="≤ ${esc(String(d.total))}" style="font-weight:800;font-size:15px"></div>
        <div class="f"><label>${GM.conf?"Motif / commentaire (obligatoire)":"Commentaire (journalisé, visible par l'assuré-aidant)"}</label><input class="in" id="gm-comm" placeholder="ex. 4 h réalisées sur 6 — accord téléphonique"></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn blue" data-act="g-partiel-payer">Marquer payé</button>${close}</div></div></div>`;
  }
  const cfg={
    confcompte:{titre:"Confirmer pour le compte de l'assuré-aidant",note:"Après contact avec l'assuré-aidant (F-25). Le devis entre dans la file des paiements.",btn:"Confirmer le service fait",cls:"teal"},
    annuler:{titre:"Annuler le devis "+(GM.ref||""),note:"Désengagement intégral : le montant retourne au disponible (F-25).",btn:"Annuler le devis",cls:"bad"},
    refuserremb:{titre:"Refuser le remboursement "+(GM.ref||""),note:"L'assuré-aidant est notifié par e-mail avec le motif (F-24).",btn:"Refuser",cls:"bad"},
    bloquer:{titre:"Bloquer le PMV",note:"Plus aucun devis, engagement ni remboursement. Les engagements en cours restent honorés ; consultation et orientation accessibles (F-27, RG-50).",btn:"Bloquer",cls:"bad"},
    commenter:{titre:"Commenter le mouvement",note:"Commentaire libre, visible par l'assuré-aidant dans son historique (F-26).",btn:"Enregistrer",cls:"blue"},
    crediter:{titre:"Créditer le PMV",note:"En V1, crédit initial et correction uniquement (F-21) ; le renouvellement annuel n'est pas outillé. Tout crédit est journalisé et irréversible — une erreur se corrige par un mouvement inverse tracé (correction négative).",btn:"Créditer",cls:"blue"},
  }[GM.kind];
  if(!cfg) return "";
  const extra=GM.kind==="crediter"
    ?`<div class="row" style="margin-bottom:8px">
        <div class="f" style="flex:0 1 150px"><label>Montant (€)</label><input class="in" id="gm-montant" placeholder="ex. 300 ou -50" style="font-weight:800"></div>
        <div class="f" style="flex:0 1 180px"><label>Motif</label><select class="in" id="gm-motif"><option>Crédit initial</option><option>Correction</option></select></div>
      </div><div class="f"><label>Commentaire (journalisé — F-26)</label><input class="in" id="gm-comm" placeholder="ex. Correction d'une erreur de saisie du 02/11"></div>`
    :`<div class="f"><label>${GM.kind==="commenter"?"Commentaire":"Motif (obligatoire)"}</label>
       <textarea class="in" id="gm-motif-txt" rows="2" style="resize:vertical" placeholder="${GM.kind==='bloquer'?'ex. Suspicion d\\u2019usage hors objet (RG-49) — vérification en cours':'…'}">${esc(GM.prefill||"")}</textarea></div>`;
  return `<div class="modal-bg" data-act="g-modal-close"><div class="modal">
    <h2>${cfg.titre}</h2><div class="muted" style="font-size:12px;margin-bottom:10px">${cfg.note}</div>
    ${extra}
    <div class="row" style="margin-top:12px"><button class="btn ${cfg.cls}" data-act="g-modal-go">${cfg.btn}</button>${close}</div></div></div>`;
}

/* ═══════ §9 · Écouteurs d'événements ═══════ */
document.addEventListener("change", async (e)=>{
  if(e.target.id==="sel-aidant"){ AIDANT_ID=e.target.value; AID=aidSeed(); AID.boundTo=AIDANT_ID; render(); return; }
  if(e.target.id==="a-metier"){ AID.cat.metier=e.target.value; render(); return; }
  if(e.target.id==="a-dept"){ AID.cat.dept=e.target.value; render(); return; }
  if(e.target.id==="ar-file"){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    if(f.size>3500000){ toast("Fichier trop volumineux (max 3,5 Mo pour la démo)",true); e.target.value=""; return; }
    const rd=new FileReader();
    rd.onload=()=>{ AID.justif={nom:f.name,data:String(rd.result)}; render(); };
    rd.readAsDataURL(f); return;
  }
  if(e.target.dataset && e.target.dataset.pay!==undefined){ GEST.selPay[e.target.dataset.pay]=e.target.checked; render(); return; }
  if(e.target.dataset && e.target.dataset.paygrp!==undefined){
    e.target.dataset.paygrp.split(",").forEach(r=>{ GEST.selPay[r]=e.target.checked; }); render(); return; }
  if(e.target.dataset && e.target.dataset.gf!==undefined){ GEST.form[e.target.dataset.gf]=e.target.value; return; }
});

document.addEventListener("input",(e)=>{
  if(e.target.id==="a-recit"){ AID.recit=e.target.value; return; }
  if(e.target.dataset && e.target.dataset.relanceI!==undefined){ AID.reponses[e.target.dataset.relanceI]=e.target.value; return; }
  if(e.target.dataset && e.target.dataset.gf!==undefined){ GEST.form[e.target.dataset.gf]=e.target.value; return; }
  if(e.target.id==="g-q"){ GEST.q=e.target.value; render();
    const el=$("#g-q"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } return; }
  if(e.target.id==="p-qty"){ PROF.devisQty=e.target.value;
    const pu=PRO_DATA&&PRO_DATA.prestation?Number(PRO_DATA.prestation.prix):NaN;
    const q=parseFloat(String(PROF.devisQty).replace(",","."));
    const tot=$("#p-total"); if(tot) tot.textContent=(!isNaN(q)&&q>0&&!isNaN(pu))?eur(+(q*pu).toFixed(2)):"—"; return; }
});

document.addEventListener("click", async (e)=>{
  const b=e.target.closest("[data-act]");
  if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  try{
    /* ── global ── */
    if(act==="role"){ ROLE=b.dataset.role; render(); return; }
    if(act==="connect"){ API=$("#apiUrl").value.trim().replace(/\/+$/,""); AIDANT_ID=null; AID=aidSeed(); GEST=null; PROF={devisQty:"",motifOpen:false}; await refresh(); toast("Connecté"); return; }
    if(act==="reset"){ await api("POST","/api/reset"); AIDANT_ID=null; AID=aidSeed(); GEST=null; PROF={devisQty:"",motifOpen:false}; MODAL=""; await refresh(); toast("État réinitialisé (jeu d'essai V1)"); return; }

    /* ── assuré-aidant : navigation, contact conseiller (F-52) ── */
    if(act==="a-tab"){ AID.tab=b.dataset.tab; render(); return; }
    if(act==="a-contact-open"){ CONTACT={type:"rappel",msg:""}; MODAL=contactModal; render(); return; }
    if(act==="a-contact-close"){ if(e.target!==b) return; MODAL=""; render(); return; }
    if(act==="a-contact-type"){ CONTACT.msg=($("#a-contact-msg")&&$("#a-contact-msg").value)||CONTACT.msg; CONTACT.type=b.dataset.v; render(); return; }
    if(act==="a-contact-envoyer"){
      const msg=($("#a-contact-msg")&&$("#a-contact-msg").value.trim())||"";
      await api("POST","/api/assures/"+AIDANT_ID+"/contacts",{type:CONTACT.type,message:msg});
      MODAL=""; await refresh(); toast("Demande transmise — un conseiller vous répond par le canal choisi"); return; }

    /* ── Ma situation (F-44/F-45) — handlers des blocs réutilisés ── */
    if(act==="a-tache"){ const v=b.dataset.v; AID.taches=AID.taches.includes(v)?AID.taches.filter(x=>x!==v):[...AID.taches,v]; render(); return; }
    if(act==="a-charge"){ const v=b.dataset.v; AID.charge=AID.charge.includes(v)?AID.charge.filter(x=>x!==v):[...AID.charge,v]; render(); return; }
    if(act==="a-consent"){ AID.consent=!AID.consent; render(); return; }
    if(act==="a-evaluer"){ await aidEvaluer(); return; }
    if(act==="a-besoin-retenir"){ const i=Number(b.dataset.i); const bn=AID.besoins[i]; if(bn){ AID.parcours=[...AID.parcours,bn]; AID.besoins=AID.besoins.filter((_,k)=>k!==i); } render(); return; }
    if(act==="a-besoin-ecarter"){ const i=Number(b.dataset.i); AID.besoins=AID.besoins.filter((_,k)=>k!==i); render(); return; }
    if(act==="a-parcours-pro"){ const fam=A_TAXO_FAMILLE[b.dataset.cat]; AID.cat={famille:fam||"",metier:"",modalite:"",dept:""}; AID.catTitre=A_TAXO_LABEL(b.dataset.cat); AID.tab="trouver"; render(); return; }
    if(act==="a-analyse-generer"){ await aidGenererAnalyse(); return; }
    if(act==="a-baro-lecture"){ await baroLecture(); return; }
    if(act==="a-baro-dim"){ AID.baroDim=(AID.baroDim===b.dataset.id?null:b.dataset.id); render(); return; }
    if(act==="a-analyse-valider"){ const t=($("#a-analyse-txt")&&$("#a-analyse-txt").value)||""; if(!t.trim()){ toast("Le bilan est vide",true); return; }
      await api("POST","/api/assures/"+AIDANT_ID+"/analyse",{texte:t});
      AID.analyseEdit=false; AID.analyseTexte=""; await refresh(); toast("Bilan validé — seule cette version est stockée (F-44)"); return; }
    if(act==="a-analyse-modifier"){ const A0=(STATE.assures||[]).find(x=>x.id===AIDANT_ID)||{}; AID.analyseEdit=true; AID.analyseTexte=A0.analyse||""; render(); return; }
    if(act==="a-analyse-annuler"){ AID.analyseEdit=false; AID.analyseTexte=""; render(); return; }

    /* ── Trouver un pro (F-46/F-47) ── */
    if(act==="a-fam"){ const v=b.dataset.v; AID.cat.famille=AID.cat.famille===v?"":v; AID.catTitre=""; render(); return; }
    if(act==="a-mod"){ const v=b.dataset.v; AID.cat.modalite=AID.cat.modalite===v?"":v; render(); return; }
    if(act==="a-cat-reset"){ AID.cat={famille:"",metier:"",modalite:"",dept:""}; AID.catTitre=""; render(); return; }
    if(act==="a-demander-devis"){ AID.demandePid=(AID.demandePid===b.dataset.pid?null:b.dataset.pid); render(); return; }
    if(act==="a-demander-envoyer"){ const msg=($("#a-dv-msg")&&$("#a-dv-msg").value.trim())||"";
      await api("POST","/api/devis",{assure_id:AIDANT_ID,prestation_id:b.dataset.pid,message:msg,
        lien_base:location.origin+location.pathname});
      AID.demandePid=null; AID.tab="prestations"; await refresh(); toast("Demande envoyée — le pro reçoit un e-mail avec votre n° de dossier et un lien de chiffrage"); return; }

    /* ── Prestations (F-48/F-49) ── */
    if(act==="a-dv-accepter"){ await api("POST",`/api/devis/${id}/accepter`); await refresh(); toast("Devis accepté — montant engagé automatiquement sur votre PMV (RG-51)"); return; }
    if(act==="a-dv-refuser"){ await api("POST",`/api/devis/${id}/refuser`); await refresh(); toast("Devis refusé"); return; }
    if(act==="a-dv-servicefait"){ await api("POST",`/api/devis/${id}/service-fait`,{}); await refresh(); toast("Service fait confirmé — le gestionnaire peut procéder au paiement (aucun paiement automatique)"); return; }
    if(act==="a-conteste-toggle"){ AID.contesteId=b.dataset.id||null; render(); return; }
    if(act==="a-dv-contester"){ const m=($("#a-conteste-motif")&&$("#a-conteste-motif").value.trim())||"";
      if(!m){ toast("Précisez pourquoi (non réalisée / incomplète)",true); return; }
      await api("POST",`/api/devis/${id}/contester`,{motif:m});
      AID.contesteId=null; await refresh(); toast("Contestation transmise — le gestionnaire va vous contacter (F-25)"); return; }

    /* ── Remboursements côté assuré-aidant (F-51) ── */
    if(act==="a-remb-soumettre"){
      const lib=($("#ar-lib")&&$("#ar-lib").value.trim())||"";
      const motif=($("#ar-motif")&&$("#ar-motif").value.trim())||"—";
      const montant=($("#ar-montant")&&$("#ar-montant").value.trim())||"";
      if(!lib){ toast("Indiquez la dépense",true); return; }
      if(!montant||isNaN(parseFloat(montant.replace(",",".")))){ toast("Indiquez un montant valide",true); return; }
      if(!AID.justif){ toast("Déposez le justificatif (PDF ou image) — obligatoire (F-51)",true); return; }
      await api("POST","/api/remboursements",{assure_id:AIDANT_ID,libelle:lib,motif,
        montant:montant.replace(",","."),justificatif_nom:AID.justif.nom,justificatif_data:AID.justif.data});
      AID.justif=null; await refresh(); toast("Demande envoyée au gestionnaire avec votre justificatif"); return; }
    if(act==="a-remb-redeposer"){
      const inp=$("#ar-refile-"+CSS.escape(id)); const f=inp&&inp.files&&inp.files[0];
      if(!f){ toast("Choisissez d'abord le fichier",true); return; }
      if(f.size>3500000){ toast("Fichier trop volumineux (max 3,5 Mo)",true); return; }
      const data=await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(String(r.result)); r.readAsDataURL(f); });
      await api("POST",`/api/remboursements/${id}/redeposer`,{justificatif_nom:f.name,justificatif_data:data});
      await refresh(); toast("Pièce déposée — la demande repasse « soumise »"); return; }

    /* ── Profil & PFD (F-41/F-42) — handlers des blocs réutilisés ── */
    if(act==="a-profil-edit"){ AID.profilEdit=!AID.profilEdit; render(); return; }
    if(act==="a-profil-completer"){
      const iban=pfVal("ai-iban"), tel=pfVal("ai-tel");
      const adresse=pfVal("pf-adresse"), cp=pfVal("pf-cp"), ville=pfVal("pf-ville"), marital=pfVal("pf-marital");
      if(!iban){ toast("Renseignez votre IBAN (RIB)",true); return; }
      if(!adresse||!cp||!ville){ toast("Renseignez vos coordonnées postales (adresse, code postal, ville)",true); return; }
      if(!marital){ toast("Indiquez votre situation familiale",true); return; }
      const profil={ adresse,cp,ville,marital, foyer:pfVal("pf-foyer"), enfants:pfVal("pf-enfants"),
        cohabite:pfVal("pf-cohabite"), distance:pfVal("pf-distance"), anciennete:pfVal("pf-anciennete"),
        heures:pfVal("pf-heures"), nuit:pfVal("pf-nuit"), taches:pfGrp("pf-taches"),
        statutpro:pfVal("pf-statutpro"), contrat:pfVal("pf-contrat"), temps:pfVal("pf-temps"),
        poste:pfVal("pf-poste"), flex:pfVal("pf-flex"), amenage:pfGrp("pf-amenage"),
        coaidants:pfVal("pf-coaidants"), role:pfVal("pf-role"), relais:pfVal("pf-relais"),
        aidesh:pfGrp("pf-aidesh"), aidesf:pfGrp("pf-aidesf"), aidesf_autre:pfVal("pf-aidesf-autre"),
        sante:pfVal("pf-sante"), fatigue:pfVal("pf-fatigue"), dispo:pfGrp("pf-dispo"), besoins:pfGrp("pf-besoins") };
      await api("POST","/api/assures/"+(b.dataset.id||AIDANT_ID)+"/profil",{iban,telephone:tel,profil});
      AID.profilEdit=false; await refresh(); toast("Profil enregistré (verrou 1 levé)"); return; }
    if(act==="a-pfd-edit"){ AID.pfdEdit=(AID.pfdEdit===b.dataset.id?null:b.dataset.id); render(); return; }
    if(act==="a-pfd-add-toggle"){ AID.pfdAddOpen=!AID.pfdAddOpen; render(); return; }
    if(act==="a-pfd-add"){
      const prenom=pfVal("pfd-new-prenom"), lien=($("#pfd-new-lien")&&$("#pfd-new-lien").value)||"Père";
      if(!prenom){ toast("Indiquez le prénom du proche",true); return; }
      const r=await api("POST","/api/assures/"+AIDANT_ID+"/aides",{prenom,lien,principal:false});
      AID.pfdAddOpen=false; AID.pfdEdit=r.aides[r.aides.length-1].id; await refresh(); toast("Proche ajouté — complétez son profil"); return; }
    if(act==="a-pfd-save"){
      const profil={ naissance:pfVal("pd-naissance"), lieu:pfVal("pd-lieu"), logement:pfVal("pd-logement"),
        adapte:pfVal("pd-adapte"), environ:pfVal("pd-environ"),
        nature:pfVal("pd-nature"), patho:pfVal("pd-patho"), mobilite:pfVal("pd-mobilite"), cognitif:pfVal("pd-cognitif"),
        avq:pfGrp("pd-avq"), isolement:pfVal("pd-isolement"), entourage:pfVal("pd-entourage"),
        aidesh:pfGrp("pd-aidesh"), aidesf:pfGrp("pd-aidesf"), aidesf_autre:pfVal("pd-aidesf-autre"), aidest:pfGrp("pd-aidest"),
        risques:pfGrp("pd-risques"), besoins:pfGrp("pd-besoins") };
      await api("POST","/api/assures/"+AIDANT_ID+"/aides/"+b.dataset.id+"/profil",{profil});
      AID.pfdEdit=null; await refresh(); toast("Profil du proche enregistré"); return; }

    /* ── professionnel (F-60/F-61) — toujours via le jeton du lien (A-1a) ── */
    if(act==="p-devis"){ const q=parseFloat(String(PROF.devisQty).replace(",","."));
      if(isNaN(q)||q<=0){ toast("Indiquez une quantité",true); return; }
      const mp=($("#p-msg")&&$("#p-msg").value.trim())||"";
      await api("POST",`/api/pro/${encodeURIComponent(PRO_JETON)}/etablir`,{quantite:String(q),message_pro:mp});
      PROF.devisQty=""; await refreshPro(); toast("Devis envoyé — l'assuré-aidant est notifié par e-mail"); return; }
    if(act==="p-decliner-toggle"){ PROF.motifOpen=!PROF.motifOpen; render(); return; }
    if(act==="p-decliner"){ const m=($("#p-motif")&&$("#p-motif").value.trim())||"";
      if(!m){ toast("Motif obligatoire (F-60)",true); return; }
      await api("POST",`/api/pro/${encodeURIComponent(PRO_JETON)}/refuser`,{motif:m});
      PROF.motifOpen=false; await refreshPro(); toast("Demande déclinée"); return; }
    if(act==="p-realisee"){ await api("POST",`/api/pro/${encodeURIComponent(PRO_JETON)}/realisee`);
      await refreshPro(); toast("Prestation déclarée réalisée — le délai de confirmation de l'assuré-aidant est ouvert"); return; }

    /* ── gestionnaire ── */
    if(act==="g-tab"){ GEST.tab=b.dataset.tab; if(b.dataset.tab==="emails"&&!GEST.emailsLoaded){ await chargerEmails(); } render(); return; }
    if(act==="g-emails-load"){ await chargerEmails(); render(); return; }
    if(act==="g-newform"){ GEST.showForm=true; render(); return; }
    if(act==="g-cancelform"){ GEST.showForm=false; render(); return; }
    if(act==="g-ndd"){ GEST.form.ndd=Number(b.dataset.n); render(); return; }
    if(act==="g-select"){ GEST.selId=(GEST.selId===id?null:id); render(); return; }
    if(act==="g-preinscrire"){
      const f=GEST.form;
      if(!f.prenom.trim()||!f.nom.trim()||!f.email.trim()){ toast("Prénom, nom et e-mail requis",true); return; }
      if(!f.ndd){ toast("Sélectionnez le NDD retenu (1–4)",true); return; }
      if(!f.credit||isNaN(parseFloat(String(f.credit).replace(",",".")))){ toast("Indiquez le crédit initial (saisie libre)",true); return; }
      if(!f.pfdPrenom.trim()||!f.pfdNaissance.trim()){ toast("PFD principal obligatoire : prénom et année de naissance (RG-41)",true); return; }
      const r=await api("POST","/api/preinscriptions",{prenom:f.prenom.trim(),nom:f.nom.trim(),email:f.email.trim(),
        contrat_ref:f.contrat,ndd:f.ndd,credit:String(f.credit).replace(",","."),commentaire:f.commentaire.trim(),
        lien_base:location.origin+location.pathname,
        pfd:{prenom:f.pfdPrenom.trim(),lien:f.pfdLien,naissance:f.pfdNaissance.trim(),ndd:f.pfdNdd||f.ndd}});
      GEST.showForm=false; GEST.form=gestSeed().form; GEST.selId=r.id;
      await refresh(); toast(`Dossier ${r.id} ouvert · PMV crédité · lien d'activation adressé (e-mail simulé)`); return; }
    if(act==="g-crediter-open"){ GM={kind:"crediter",ref:null,aid:id}; MODAL=gModal; render(); return; }
    if(act==="g-bloquer-open"){ GM={kind:"bloquer",ref:null,aid:id}; MODAL=gModal; render(); return; }
    if(act==="g-debloquer"){ await api("POST",`/api/assures/${id}/debloquer`,{commentaire:"Déblocage"}); await refresh(); toast("PMV débloqué"); return; }
    if(act==="g-commenter-open"){ const a=gAssure(id); const mv=(a.pmv.mouvements||[]).find(m=>m.id===b.dataset.mv);
      GM={kind:"commenter",ref:b.dataset.mv,aid:id,prefill:mv?mv.commentaire:""}; MODAL=gModal; render(); return; }
    if(act==="g-partiel-open"){ GM={kind:"partiel",ref:id,aid:null,conf:b.dataset.conf==="1"}; MODAL=gModal; render(); return; }
    if(act==="g-confcompte-open"){ GM={kind:"confcompte",ref:id}; MODAL=gModal; render(); return; }
    if(act==="g-annuler-open"){ GM={kind:"annuler",ref:id}; MODAL=gModal; render(); return; }
    if(act==="g-remb-refuser-open"){ GM={kind:"refuserremb",ref:id}; MODAL=gModal; render(); return; }
    if(act==="g-modal-close"){ if(e.target!==b) return; GM={kind:null}; MODAL=""; render(); return; }
    if(act==="g-modal-go"){
      const txt=($("#gm-motif-txt")&&$("#gm-motif-txt").value.trim())||"";
      if(GM.kind==="confcompte"){ if(!txt){ toast("Motif obligatoire (F-25)",true); return; }
        await api("POST",`/api/devis/${GM.ref}/service-fait`,{par:"gestionnaire",motif:txt}); toast("Service fait confirmé pour le compte de l'assuré-aidant — devis payable"); }
      else if(GM.kind==="annuler"){ if(!txt){ toast("Motif obligatoire (F-25)",true); return; }
        await api("POST",`/api/devis/${GM.ref}/annuler`,{motif:txt}); toast("Devis annulé — montant intégralement désengagé"); }
      else if(GM.kind==="refuserremb"){ if(!txt){ toast("Motif obligatoire",true); return; }
        await api("POST",`/api/remboursements/${GM.ref}/refuser`,{motif:txt}); toast("Remboursement refusé — assuré-aidant notifié (F-24)"); }
      else if(GM.kind==="bloquer"){ if(!txt){ toast("Motif obligatoire (F-27)",true); return; }
        await api("POST",`/api/assures/${GM.aid}/bloquer`,{motif:txt}); toast("PMV bloqué — crédit acquis conservé (RG-50)"); }
      else if(GM.kind==="commenter"){
        await api("POST",`/api/assures/${GM.aid}/mouvements/${GM.ref}/commenter`,{commentaire:txt}); toast("Commentaire enregistré — visible par l'assuré-aidant (F-26)"); }
      else if(GM.kind==="crediter"){
        const m=($("#gm-montant")&&$("#gm-montant").value.trim())||"";
        const motif=($("#gm-motif")&&$("#gm-motif").value)||"Crédit initial";
        const comm=($("#gm-comm")&&$("#gm-comm").value.trim())||"";
        if(!m||isNaN(parseFloat(m.replace(",",".")))){ toast("Montant invalide",true); return; }
        await api("POST",`/api/assures/${GM.aid}/crediter`,{montant:m.replace(",","."),motif,commentaire:comm}); toast("PMV crédité — mouvement journalisé, irréversible (F-21)"); }
      GM={kind:null}; MODAL=""; await refresh(); return; }
    if(act==="g-partiel-payer"){
      const m=($("#gm-montant")&&$("#gm-montant").value.trim())||"";
      const comm=($("#gm-comm")&&$("#gm-comm").value.trim())||"";
      if(!m||isNaN(parseFloat(m.replace(",",".")))){ toast("Montant invalide",true); return; }
      if(GM.conf){ if(!comm){ toast("Motif obligatoire (F-25)",true); return; }
        await api("POST",`/api/devis/${GM.ref}/service-fait`,{par:"gestionnaire",motif:comm}); }
      const pr=await api("POST",`/api/devis/${GM.ref}/payer`,{montant:m.replace(",","."),commentaire:comm});
      GM={kind:null}; MODAL=""; if(pr.bordereau){ GEST.brdOpen=pr.bordereau.id; } await refresh();
      toast(`Paiement partiel saisi — bordereau ${pr.bordereau?pr.bordereau.id:""} à exécuter à la banque ; reliquat recrédité, assuré-aidant notifié (F-24)`); return; }
    if(act==="g-payer-lot"){
      const devis=Object.keys(GEST.selPay).filter(k=>GEST.selPay[k]&&k.includes("-D"));
      const rembs=Object.keys(GEST.selPay).filter(k=>GEST.selPay[k]&&k.includes("-R"));
      const r=await api("POST","/api/paiements",{devis,remboursements:rembs,commentaire:"Lot du "+new Date().toLocaleDateString("fr-FR")});
      GEST.selPay={}; if(r.bordereau){ GEST.brdOpen=r.bordereau.id; }
      await refresh();
      toast(r.bordereau?`${r.payes.length} paiement(s) saisi(s) — bordereau ${r.bordereau.id} généré, à exécuter à la banque`+(r.erreurs.length?` · ${r.erreurs.length} erreur(s)`:""):`Aucun paiement saisi : ${r.erreurs.length?r.erreurs[0].erreur:"sélection vide"}`, !r.bordereau||r.erreurs.length>0); return; }
    if(act==="g-brd-toggle"){ GEST.brdOpen=(GEST.brdOpen===id?null:id); render(); return; }
    if(act==="g-brd-executer"){ const bx=await api("POST",`/api/bordereaux/${id}/executer`,{});
      await refresh(); toast(`Bordereau ${bx.id} marqué exécuté (${dateFR(bx.date_execution)}) — virements passés en banque`); return; }
    if(act==="g-remb-valider"){ const r=await api("POST",`/api/remboursements/${id}/valider`);
      await refresh(); toast(`Validé ${eur(r.montant_valide)}${r.partiel?" (partiel — à hauteur du disponible, RG-44)":""} — engagé sur le PMV, basculé dans « Paiements à effectuer »`); return; }
    if(act==="g-remb-piece"){ await api("POST",`/api/remboursements/${id}/piece`); await refresh(); toast("Pièce complémentaire demandée"); return; }
    if(act==="g-tache"){ const t=await api("POST","/api/tache-quotidienne");
      await refresh(); toast(t.message); return; }
  }catch(err){
    toast(err.message||"Erreur",true);
  }
});

async function chargerEmails(){
  try{ const r=await api("GET","/api/emails"); GEST.emails=r.emails||[]; GEST.emailsLoaded=true; }
  catch(e){ GEST.emails=[]; GEST.emailsLoaded=true; }
}

/* ── amorçage : lien d'activation ?dossier=… (F-40) · lien pro ?pro=<jeton> (A-1a) ── */
(function(){
  try{
    const sp=new URLSearchParams(location.search);
    const j=sp.get("pro");
    if(j){ PRO_JETON=j; return; }
    const m=sp.get("dossier");
    if(m){ ROLE="aidant"; AIDANT_ID=m; }
  }catch(_){ }
})();
$("#apiUrl").value = API;
refresh();
</script>
</body>
</html>
