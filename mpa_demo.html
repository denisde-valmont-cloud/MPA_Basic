<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPA — V1 · 3 rôles</title>
<style>
  :root{
    --purple:#7A2D6B; --purpleLt:#F3E8F0; --gold:#E2A93B; --goldDk:#B9851F; --goldLt:#FBEFD6;
    --teal:#3F7067; --tealMid:#5E9C92; --tealLt:#E4EFEC; --blue:#2F5DA8; --blueLt:#EAF0FA;
    --ink:#2A2433; --paper:#FBF9F6; --card:#FFFFFF; --line:#EBE5DE; --muted:#8C8492;
    --good:#2E7D5B; --bad:#C0492F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
  .wrap{max-width:1040px;margin:0 auto;padding:18px}
  /* topbar */
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .brand{font-weight:800;font-size:18px;color:var(--purple);letter-spacing:-.3px}
  .brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
  .apibox{margin-left:auto;display:flex;gap:6px;align-items:center}
  .apibox input{padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:12px;width:210px;font-family:inherit}
  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 18px}
  .tab{padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:#fff;
    font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
  .tab.on{color:#fff;border-color:transparent}
  .tab.on.contrat{background:var(--purple)} .tab.on.indem{background:var(--blue)}
  .tab.on.aidant{background:var(--teal)} .tab.on.pro{background:var(--goldDk)}
  /* layout */
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}
  h2{font-size:15px;margin:0 0 12px;color:var(--ink)}
  h2 .sub{font-weight:500;color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:700;padding:9px 10px;background:var(--paper)}
  td{padding:9px 10px;border-top:1px solid var(--line)}
  .btn{border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:var(--purple);font-family:inherit}
  .btn.blue{background:var(--blue)} .btn.teal{background:var(--teal)} .btn.gold{background:var(--goldDk)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.bad{background:#fff;color:var(--bad);border:1px solid var(--bad)}
  .btn:disabled{background:var(--muted);cursor:default;opacity:.6}
  input,select{font-family:inherit}
  .in{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .f{flex:1 1 140px} .f label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .chip{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px}
  .pmv{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .stat{flex:1 1 130px;background:var(--paper);border-radius:12px;padding:11px 13px}
  .stat b{display:block;font-size:20px} .stat span{font-size:11px;color:var(--muted);font-weight:600}
  .nddbtn{flex:1 1 92px;text-align:left;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
    background:#fff;cursor:pointer;font-family:inherit}
  .nddbtn.on{background:var(--purple);color:#fff;border-color:transparent}
  .nddbtn.no{opacity:.55;cursor:not-allowed;background:#FAF8F6}
  .nddbtn b{display:block;font-size:13px} .nddbtn small{font-size:10px;color:var(--muted)}
  .muted{color:var(--muted)} .right{text-align:right}
  pre{background:#2A2433;color:#E9E2DE;border-radius:12px;padding:14px;overflow:auto;max-height:240px;font-size:11px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 16px;border-radius:11px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);
    opacity:0;transition:opacity .2s;pointer-events:none;max-width:480px;z-index:50}
  .toast.show{opacity:1} .toast.err{background:var(--bad)}
  .empty{padding:24px;text-align:center;color:var(--muted)}
  /* — ajouts V1 — */
  .ptip{position:relative;cursor:help;border-bottom:1px dotted var(--muted)}
  .ptip .ptip-box{display:none;position:absolute;left:0;bottom:calc(100% + 8px);z-index:40;width:310px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 26px rgba(0,0,0,.14);font-weight:400;font-size:12px;line-height:1.5;color:var(--ink);white-space:normal;text-align:left}
  .ptip:hover .ptip-box{display:block}
  .eq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:8px}
  .eq b{color:var(--ink)}
  .nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;margin-left:6px}
  .dosbar{position:sticky;top:0;z-index:30;background:var(--purple);color:#fff;border-radius:13px;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;box-shadow:0 6px 18px rgba(122,45,107,.25)}
  .dosbar .num{font-weight:800;letter-spacing:.5px;font-size:14.5px}
  body.promode #tabs, body.promode .apibox{display:none}
  .modal-bg{position:fixed;inset:0;background:rgba(42,36,51,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:#fff;border-radius:16px;padding:20px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">MPA — V1<small>Spécifications fonctionnelles V1.1 · un PMV par dossier · le pro répond par lien sécurisé, sans compte</small></div>
    <div class="apibox">
      <input id="apiUrl" value="http://127.0.0.1:8765">
      <button class="btn ghost" data-act="connect">Connecter</button>
      <button class="btn ghost" data-act="reset">Réinitialiser</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab aidant on" data-act="role" data-role="aidant">Assuré-aidant</button>
    <button class="tab indem" data-act="role" data-role="indem">Gestionnaire indemnisation</button>
  </div>
  <div id="panel"></div>
</div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
/* ╔════════════════════════════════════════════════════════════════════════╗
   ║  MPA V1 — shell 3 rôles (specs fonctionnelles V1.1 du 06/11/2026)       ║
   ║  SOMMAIRE                                                               ║
   ║   §1  État global, accès API, rendu                                     ║
   ║       (mode « pro » : ?pro=<jeton> -> GET /api/pro/<jeton> seulement,   ║
   ║        jamais /api/state — minimisation des données)                    ║
   ║   §2  Helpers (PMV 5 chiffres & équations F-43, fil d'avancement F-50)  ║
   ║   §3  Profils situationnels (F-41/F-42) — formulaires aidant & PFD      ║
   ║   §4  Ma situation (F-44/F-45) : bilan IA validé, besoins, parcours     ║
   ║   §5  Trouver un pro (F-46) : catégories retenues + catalogue 3 facettes║
   ║   §6  Assuré-aidant : Accueil · Prestations (F-49/F-50) ·               ║
   ║       Mon PMV & remboursements (F-43/F-51) · Dossier · Contact (F-52)   ║
   ║   §7  Pro de l'aidance (F-60/F-61) — SANS COMPTE : formulaire           ║
   ║       mono-demande ouvert par ?pro=<jeton> reçu par e-mail (A-1a)       ║
   ║   §8  Gestionnaire (F-20 à F-28) : dossiers, FILE DES PAIEMENTS,        ║
   ║       remboursements, alertes, e-mails simulés, exports                 ║
   ║   §9  Écouteurs d'événements                                            ║
   ║  Règles clés : engagement = clic d'acceptation (RG-51) ; paiement       ║
   ║  TOUJOURS manuel par le gestionnaire (RG-52) ; aucune libération        ║
   ║  automatique (F-70) ; double verrou RIB + profil PFD (RG-42).           ║
   ╚════════════════════════════════════════════════════════════════════════╝ */

/* ═══════ §1 · État global & accès API ═══════ */
const SAME_ORIGIN = location.protocol.indexOf("http") === 0 ? location.origin : "";
let API = SAME_ORIGIN || "http://127.0.0.1:8765";
let ROLE = "aidant";
let STATE = null;
let AIDANT_ID = null;
let PRO_JETON = null;   // A-1a — jeton du lien sécurisé (?pro=…) : mode formulaire pro
let PRO_DATA = null;    //        la demande servie par GET /api/pro/<jeton> (minimisée)
let PRO_ERR = null;     //        erreur d'accès (lien invalide, révoqué, plafond atteint)

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function eur(x){ const n=Number(x); return isNaN(n)?"—":n.toLocaleString("fr-FR",{style:"currency",currency:"EUR"}); }
function dateFR(iso){ if(!iso)return "—"; const p=String(iso).split(" ")[0].split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso; }
const $=(s,r=document)=>r.querySelector(s);

function toast(msg, err=false){
  const t=$("#toast"); t.textContent=msg; t.className="toast show"+(err?" err":"");
  clearTimeout(t._h); t._h=setTimeout(()=>t.className="toast",3400);
}

async function api(method, path, body){
  const r=await fetch(API+path,{method,headers:{"Content-Type":"application/json"},
    body:body!==undefined?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||("Erreur "+r.status));
  return data;
}

async function refresh(){
  if(PRO_JETON) return refreshPro();          // le formulaire pro ne voit QUE sa demande
  try{
    STATE=await api("GET","/api/state");
  }catch(e){ STATE=null; toast("API injoignable : "+e.message,true); render(); return; }
  const assures=STATE.assures||[];
  if(assures.length && (!AIDANT_ID || !assures.some(a=>a.id===AIDANT_ID)))
    AIDANT_ID=assures[0].id;
  render();
}

function updateTabs(){ document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.role===ROLE)); }

async function refreshPro(){
  try{ PRO_DATA=await api("GET","/api/pro/"+encodeURIComponent(PRO_JETON)); PRO_ERR=null; }
  catch(e){ PRO_DATA=null; PRO_ERR=e.message||"Lien invalide"; }
  render();
}

function render(){
  if(PRO_JETON){                              // A-1a — pas d'espace : un formulaire
    document.body.classList.add("promode");
    $("#panel").innerHTML=viewProForm();
    $("#modal-root").innerHTML="";
    return;
  }
  updateTabs();
  const p=$("#panel");
  if(!STATE){ p.innerHTML=`<div class="card empty">Connectez-vous à l'API (bouton « Connecter »).</div>`; return; }
  p.innerHTML = ROLE==="indem" ? viewGest() : viewAidant();
  $("#modal-root").innerHTML = MODAL ? (typeof MODAL==="function"?MODAL():MODAL) : "";
}
let MODAL="";   // contenu HTML du modal courant ("" = fermé)

/* ═══════ §2 · Helpers V1 ═══════ */
// — F-43 : les 5 chiffres du PMV et les deux équations —
function pmvStrip5(env, compact){
  if(!env) return "";
  const s=(l,v,tone)=>`<div class="stat" style="flex:1 1 ${compact?'96px':'118px'}"><b style="font-size:${compact?'15px':'19px'};color:${tone||'var(--ink)'}">${eur(v)}</b><span>${esc(l)}</span></div>`;
  return `<div class="pmv">
    ${s("Crédit cumulé",env.credit_cumule,"var(--purple)")}
    ${s("Payé",env.paye,"var(--muted)")}
    ${s("Solde",env.solde)}
    ${s("Engagé",env.engage,"var(--goldDk)")}
    ${s("Disponible",env.disponible,"var(--good)")}
  </div>
  <div class="eq">Crédit cumulé <b>${eur(env.credit_cumule)}</b> − payé <b>${eur(env.paye)}</b> = solde <b>${eur(env.solde)}</b><span style="opacity:.5">·</span>solde − engagé <b>${eur(env.engage)}</b> = <b style="color:var(--good)">disponible ${eur(env.disponible)}</b></div>`;
}

// — F-50 : fil d'avancement d'un devis (demandé → devisé → engagé → réalisé → payé) —
const DV_FLOW=["demande","devisé","engagé","réalisée","payé"];
const DV_IDX={demande:0,"devisé":1,"engagé":2,"réalisée":3,"payé":4};
const DV_FLOW_LBL=["Demandé","Devisé","Engagé","Réalisé","Payé"];
function dvStepper(d){
  if(["refusé","annulé","contestée"].includes(d.statut)){
    const t={refusé:["Refusé","var(--muted)",d.motif_refus],
             annulé:["Annulé par le gestionnaire","var(--bad)",d.motif_annulation],
             contestée:["Contesté — à l'étude par le gestionnaire","var(--bad)",d.motif_contestation]}[d.statut];
    return `<div style="display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;background:var(--paper);margin-bottom:10px"><span class="chip" style="color:#fff;background:${t[1]}">${t[0]}</span>${t[2]?`<span class="muted" style="font-size:12px">${esc(t[2])}</span>`:""}</div>`;
  }
  const idx=DV_IDX[d.statut]??0;
  return `<div style="display:flex;align-items:center;margin:4px 0 10px">`+DV_FLOW.map((st,i)=>{
    const done=i<idx||(i===idx&&st==="payé"), cur=i===idx&&st!=="payé";
    return `<div style="display:flex;align-items:center;flex:${i<4?'1':'0 0 auto'}">
      <div title="${DV_FLOW_LBL[i]}" style="display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;flex-shrink:0;background:${done?'var(--teal)':cur?'var(--tealMid)':'var(--card)'};border:1px solid ${done||cur?'transparent':'var(--line)'};color:${done||cur?'#fff':'var(--muted)'};font-size:10.5px;font-weight:800">${done?'✓':i+1}</div>
      ${i<4?`<div style="flex:1;height:2px;margin:0 4px;background:${i<idx?'var(--teal)':'var(--line)'}"></div>`:''}</div>`;
  }).join("")+`</div>
  <div class="muted" style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;margin:-6px 1px 10px"><span>Demandé</span><span>Devisé</span><span>Engagé</span><span>Réalisé</span><span>Payé</span></div>`;
}

const NDD_FULL={1:["Dépendance totale","Troubles physiques ou mentaux avancés",6,true],
  2:["Dépendance sévère","Majeure partie au lit/fauteuil ou aptitudes mentales fortement altérées",6,true],
  3:["Dépendance importante","Pour les actes du quotidien",4,true],
  4:["Dépendance moyenne","Pour les actes du quotidien",4,true],
  5:["Dépendance faible","Pour les actes du quotidien",null,false],
  6:["Aucune dépendance","Le handicap/pathologie ne provoque pas de dépendance",null,false]};

const A_TACHES=[["administratif","Démarches administratives"],["rdv_medicaux","RDV médicaux"],["transport","Transports"],["actes_quotidien","Actes de la vie quotidienne"],["soutien_moral","Soutien moral"],["coordination","Coordination des intervenants"]];
const A_CHARGE=[["fatigue","Fatigue / épuisement"],["sommeil","Nuits difficiles"],["isolement","Isolement"],["repit","Besoin de répit"],["pro","Impact sur ma vie pro"]];
const A_ORIGINES=["Grand âge","Handicap moteur","Handicap sensoriel","Handicap psychique","Handicap cognitif/intellectuel","Maladie évolutive","Post-accident"];
const A_LIENS=["Enfant","Frère","Sœur","Conjoint","Père","Mère"];
const A_GIR=["GIR 1 (le plus dépendant)","GIR 2","GIR 3","GIR 4","GIR 5","GIR 6 (autonome)"];
const A_NIVEAUX=["Légère","Modérée","Importante","Totale"];
const A_HORIZONS=[3,6,9,12];
const A_TAXO=[["assistance_administrative","Assistance administrative"],["logement_adaptation","Adaptation du logement / ergothérapie"],["logement_social","Logement social"],["aide_domicile","Aide à domicile (actes quotidiens)"],["soutien_psychologique","Soutien psychologique"],["repit","Répit de l'aidant"],["mobilite_transport","Mobilité / transport"],["formation_aidant","Formation de l'aidant"],["accompagnement_independance","Accompagnement vers l'indépendance"]];
const A_TAXO_LABEL=id=>{const t=A_TAXO.find(x=>x[0]===id);return t?t[1]:id;};
const A_TAXO_IDS=A_TAXO.map(t=>t[0]);
const A_TAXO_FAMILLE={assistance_administrative:"Aide administrative",logement_adaptation:"Aide matérielle",logement_social:"Aide administrative",aide_domicile:"Aide humaine",soutien_psychologique:"Aide psycho-affective",repit:"Aide au parcours de vie",mobilite_transport:"Aide matérielle",formation_aidant:"Aide au parcours de vie",accompagnement_independance:"Aide au parcours de vie"};
const A_MOD={distanciel:"À distance",presentiel_aidant:"Chez l'aidant",presentiel_pro:"Chez le pro"};
const A_UNITE={"Par heure":"/ heure","Par jour":"/ jour","Prestation complète":"forfait"};
const A_LBL={0:["Premium","var(--gold)","var(--goldLt)"],1:["Labellisé","var(--purple)","var(--purpleLt)"],2:["Autre","var(--muted)","#F0EDEA"]};
const A_uniq=a=>[...new Set(a)].sort((x,y)=>x.localeCompare(y,"fr"));
/* Catalogue dérivé de l'état partagé : le moteur Python est la source de vérité. */
function A_proNom(pid){ const p=((STATE&&STATE.pros)||[]).find(x=>x.id===pid); return p?p.nom:pid; }
function A_rows(){ return ((STATE&&STATE.prestations)||[]).map(p=>({
  id:p.id, pid:p.pid, pro:A_proNom(p.pro_id), pro_id:p.pro_id, rank:Number(p.rank),
  metiers:p.metiers||[], familles:p.familles||[], mod:p.mod||[], nat:!!p.nat,
  deps:p.deps||[], prix:(p.prix==null?null:Number(p.prix)), unite:p.unite, nom:p.nom, desc:p.desc||"" })); }
function A_deptsList(){ return (STATE&&STATE.depts)||[]; }
function A_famillesList(){ return A_uniq(A_rows().flatMap(r=>r.familles)); }
function A_metiersList(){ return A_uniq(A_rows().flatMap(r=>r.metiers)); }
function aChips(items,active,act,color){
  return `<div style="display:flex;gap:7px;flex-wrap:wrap">`+items.map(([id,label])=>{
    const on=active.includes(id);
    return `<button class="chip" data-act="${act}" data-v="${esc(id)}" style="cursor:pointer;padding:7px 12px;font-weight:600;font-size:12.5px;border:1px solid ${on?color:'var(--line)'};background:${on?color+'1F':'#fff'};color:${on?'var(--ink)':'var(--muted)'}">${esc(label)}</button>`;
  }).join("")+`</div>`;
}

/* ═══════ §3 · Profils situationnels (blocs réutilisés de la pré-prod « mpa-aidant ») ═══════ */
/* ── Profil aidant : analyse situationnelle (réf. grille multidim. FPFR · EMS-APA CNSA · grille répit HAS) ── */
const PF_MARITAL=["Célibataire","En couple","Marié(e) / Pacsé(e)","Divorcé(e) / Séparé(e)","Veuf(ve)"];
const PF_FOYER=["Seul(e)","En couple sans enfant","Avec enfant(s) à charge","Famille monoparentale","Autre"];
const PF_COHAB=["Oui, je vis avec mon proche","Non"];
const PF_DISTANCE=["Même logement","Moins de 15 min","15 à 30 min","30 min à 1 h","Plus d'1 h"];
const PF_ANCIENNETE=["Moins de 6 mois","6 mois à 2 ans","2 à 5 ans","Plus de 5 ans"];
const PF_HEURES=["Moins de 4 h/sem","4 à 10 h/sem","10 à 20 h/sem","20 à 40 h/sem","Plus de 40 h/sem"];
const PF_NUIT=["Non","Oui, ponctuellement","Oui, régulièrement"];
const PF_TACHES=["Actes essentiels (toilette, repas)","Tâches domestiques","Démarches administratives","Soins / surveillance","Accompagnement / transport","Soutien moral"];
const PF_STATUT_PRO=["Salarié(e)","Indépendant(e)","Fonctionnaire","Demandeur d'emploi","Retraité(e)","Au foyer","Étudiant(e)"];
const PF_CONTRAT=["CDI","CDD","Intérim","Sans objet"];
const PF_TEMPS=["Temps plein","Temps partiel"];
const PF_POSTE=["Horaires de journée","Travail posté / décalé","Travail de nuit","Horaires variables"];
const PF_FLEX=["Aucune flexibilité","Faible","Modérée","Forte"];
const PF_AMENAGE=["Télétravail","Horaires individualisés","Temps partiel","Congé proche aidant","Don de jours / CET"];
const PF_COAIDANTS=["Je suis le seul aidant","Oui, un autre aidant","Oui, plusieurs aidants"];
const PF_ROLE=["Aidant principal","Aidant secondaire"];
const PF_RELAIS=["Relais possible facilement","Relais possible parfois","Aucun relais"];
const PF_AIDES_H=["Aide à domicile","Infirmier / SSIAD","Accueil de jour","Plateforme de répit"];
const PF_AIDES_F=["AJPA (congé proche aidant)","AJPP (présence parentale)","Dédommagement aidant (via PCH)","Salariat via CESU","AVPF (retraite du proche aidant)","Droit au répit","Aide de l'employeur (CESU préfinancé, CSE, dons de jours)","Aide d'une action sociale (CCAS, département)","Aide d'une caisse de retraite","Crédit d'impôt (services à la personne)","Aucune"];
const PF_SANTE=["Bonne","Moyenne","Altérée"];
const PF_FATIGUE=["Faible","Modérée","Élevée"];
const PF_DISPO=["Matin","Après-midi","Soir","Week-end"];

function pfVal(id){ const el=$("#"+id); return el?String(el.value||"").trim():""; }
function pfGrp(grp){ try{ return Array.from(document.querySelectorAll('[data-grp="'+grp+'"]:checked')).map(e=>e.value); }catch(_){ return []; } }
function pfSel(id,label,opts,val,flex){ return `<div class="f" style="flex:${flex||'1 1 180px'}"><label>${esc(label)}</label><select class="in" id="${id}"><option value="">—</option>${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join("")}</select></div>`; }
function pfInp(id,label,val,ph,flex){ return `<div class="f" style="flex:${flex||'1 1 180px'}"><label>${esc(label)}</label><input class="in" id="${id}" value="${esc(val||"")}" placeholder="${esc(ph||"")}"></div>`; }
function pfChk(grp,opts,vals){ return `<div style="display:flex;flex-wrap:wrap;gap:0 4px">${opts.map(o=>`<label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;margin:0 12px 7px 0;cursor:pointer"><input type="checkbox" data-grp="${grp}" value="${esc(o)}" ${(vals||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join("")}</div>`; }
function pfHead(t){ return `<div style="font-size:11.5px;font-weight:800;color:var(--purple);margin:16px 0 8px;letter-spacing:.4px">${esc(t.toUpperCase())}</div>`; }

/* ═══════ §4 · Ma situation — bilan (F-44) & besoins (F-45) ═══════ */
function _pj(arr){ return (arr||[]).filter(Boolean).join(", "); }
function profilAidantLines(ap){
  ap=ap||{}; const L=[];
  let fam=_pj([ap.marital,ap.foyer]); if(ap.enfants&&ap.enfants!=="0") fam+=(fam?", ":"")+ap.enfants+" enfant(s) à charge";
  if(fam) L.push(["Situation familiale",fam]);
  const pro=_pj([ap.statutpro,ap.contrat,ap.temps]); if(pro) L.push(["Situation professionnelle",pro]);
  const org=_pj([ap.poste, ap.flex&&("flexibilité "+ap.flex.toLowerCase())]); if(org) L.push(["Organisation du travail",org]);
  if((ap.amenage||[]).length) L.push(["Aménagements",_pj(ap.amenage)]);
  const lien=_pj([ap.cohabite, ap.distance&&("à "+ap.distance.toLowerCase()), ap.anciennete&&("aidant depuis "+ap.anciennete.toLowerCase())]); if(lien) L.push(["Lien avec le proche",lien]);
  const charge=_pj([ap.heures, (ap.nuit&&ap.nuit!=="Non")&&("aide de nuit : "+ap.nuit.toLowerCase())]); if(charge) L.push(["Charge d'aide",charge]);
  if((ap.taches||[]).length) L.push(["Tâches assumées",_pj(ap.taches)]);
  const ent=_pj([ap.coaidants,ap.role,ap.relais]); if(ent) L.push(["Entourage / relais",ent]);
  const aides=_pj([...(ap.aidesh||[]),...(ap.aidesf||[]),ap.aidesf_autre]); if(aides) L.push(["Aides déjà en place",aides]);
  const ret=_pj([ap.sante&&("santé "+ap.sante.toLowerCase()), ap.fatigue&&("fatigue "+ap.fatigue.toLowerCase())]); if(ret) L.push(["Retentissement",ret]);
  if((ap.dispo||[]).length) L.push(["Disponibilités",_pj(ap.dispo)]);
  if((ap.besoins||[]).length) L.push(["Besoins exprimés",_pj(ap.besoins)]);
  return L;
}
function profilPfdLines(pfds){
  return (pfds||[]).map(pfd=>{
    const p=pfd.profil||{}, L=[];
    if(p.lieu) L.push(p.lieu);
    const dep=_pj([p.nature,p.patho]); if(dep) L.push(dep);
    if(p.mobilite) L.push("mobilité : "+p.mobilite.toLowerCase());
    if(p.cognitif&&p.cognitif!=="Aucun") L.push("troubles cognitifs : "+p.cognitif.toLowerCase());
    if((p.avq||[]).length) L.push("aide pour : "+_pj(p.avq));
    if(p.isolement) L.push("isolement "+p.isolement.toLowerCase());
    const ai=_pj([...(p.aidesh||[]),...(p.aidesf||[]),...(p.aidest||[]),p.aidesf_autre]); if(ai) L.push("aides : "+ai);
    if((p.risques||[]).length) L.push("risques : "+_pj(p.risques));
    if((p.besoins||[]).length) L.push("besoins : "+_pj(p.besoins));
    return { head:`${pfd.prenom||"PFD"} — ${pfd.lien}${pfd.ndd?`, NDD ${pfd.ndd}`:""}${pfd.principal?" · proche de référence":""}`, lines:L };
  });
}
function profilAidantTxt(ap){ const L=profilAidantLines(ap); return L.length?L.map(x=>`- ${x[0]} : ${x[1]}`).join("\n"):"(profil aidant non renseigné)"; }
function profilPfdTxt(pfds){ const P=profilPfdLines(pfds); return P.length?P.map(p=>`- ${p.head} : ${p.lines.join(" ; ")||"profil non renseigné"}`).join("\n"):"(aucun PFD renseigné)"; }

function aidFiche(){
  const a=AID;
  const A0=(STATE.assures||[]).find(x=>x.id===AIDANT_ID)||{};
  const aLines=profilAidantLines(A0.profil), pBlocks=profilPfdLines(A0.aides||[]);
  const hasCtx = aLines.length>0 || pBlocks.some(b=>b.lines.length>0);
  const canEval=a.consent && (hasCtx || a.recit.trim().length>4);
  const socle=`<div class="card">
    <h2 style="color:var(--purple)">Moi, aidant <span class="sub">— l'essentiel : ce que vous assumez, et ce qui pèse</span></h2>
    <div style="font-size:12.5px;font-weight:700;margin-bottom:8px">Ce que je fais pour mon proche</div>

async function aidGenererAnalyse(){
  const A0=(STATE.assures||[]).find(x=>x.id===AIDANT_ID)||{};
  AID.analyseLoading=true; render();
  const apTxt=profilAidantTxt(A0.profil), pdTxt=profilPfdTxt(A0.aides||[]);
  const tachesTxt=AID.taches.map(t=>{const x=A_TACHES.find(y=>y[0]===t);return x?x[1]:t;}).join(", ")||"non précisé";
  const chargeTxt=AID.charge.map(c=>{const x=A_CHARGE.find(y=>y[0]===c);return x?x[1]:c;}).join(", ")||"non précisé";
  const prompt=`Données pour la synthèse situationnelle.

PROFIL DE L'AIDANT :
${apTxt}

PROFIL DU / DES PROCHE(S) FAMILIAL(AUX) DÉPENDANT(S) :
${pdTxt}

ÉLÉMENTS DÉCLARÉS — tâches assumées : ${tachesTxt} ; charge ressentie : ${chargeTxt}.
RÉCIT LIBRE DE L'AIDANT : "${AID.recit||"(non renseigné)"}"

Rédige la synthèse situationnelle demandée (40 lignes maximum).`;
  try{
    const res=await api("POST","/api/analyse/generer",{prompt});
    if(!res || res.texte==null) throw new Error("indispo");
    AID.analyseTexte=String(res.texte); AID.analyseEdit=true;
    toast("Analyse générée — relisez, ajustez si besoin, puis validez");
  }catch(e){
    const L=profilAidantLines(A0.profil), P=profilPfdLines(A0.aides||[]);
    const parts=["SITUATION DE L'AIDANT"];
    L.forEach(x=>parts.push("• "+x[0]+" : "+x[1]));
    parts.push(""); parts.push("SITUATION DU / DES PROCHE(S)");
    P.forEach(b=>{parts.push("• "+b.head); (b.lines||[]).forEach(l=>parts.push("   - "+l));});
    if(AID.recit&&AID.recit.trim()){ parts.push(""); parts.push("DANS SES MOTS"); parts.push(AID.recit.trim()); }
    parts.push(""); parts.push("(Synthèse locale — l'assistant IA n'était pas disponible. Vous pouvez la compléter avant validation.)");
    AID.analyseTexte=parts.join("\n"); AID.analyseEdit=true;
    toast("Assistant indisponible — synthèse locale proposée",true);
  }
  AID.analyseLoading=false; render();
}

async function aidEvaluer(){
  AID.loading=true; AID.aiNote=null; AID.besoins=[]; AID.relances=[]; render();
  const tachesTxt=AID.taches.map(t=>{const x=A_TACHES.find(y=>y[0]===t);return x?x[1]:t;}).join(", ")||"non précisé";
  const chargeTxt=AID.charge.map(c=>{const x=A_CHARGE.find(y=>y[0]===c);return x?x[1]:c;}).join(", ")||"non précisé";
  const A0=(STATE.assures||[]).find(x=>x.id===AIDANT_ID)||{};
  const apTxt=profilAidantTxt(A0.profil), pdTxt=profilPfdTxt(A0.aides||[]);
  const analyseTxt = A0.analyse ? ("\n\nSYNTHÈSE SITUATIONNELLE VALIDÉE PAR L'AIDANT (à exploiter en priorité) :\n"+A0.analyse) : "";
  const reponsesTxt=Object.values(AID.reponses).filter(Boolean).map(r=>`• ${r}`).join("\n");
  const taxoTxt=A_TAXO.map(t=>`${t[0]} (${t[1]})`).join(", ");
  const prompt=`Tu es le moteur d'anticipation des besoins de l'application "Mon Parcours Aidant".${analyseTxt}

PROFIL SITUATIONNEL DE L'AIDANT (analyse à exploiter en priorité) :
${apTxt}

PROFIL SITUATIONNEL DU / DES PROCHE(S) FAMILIAL(AUX) DÉPENDANT(S) :
${pdTxt}

ÉLÉMENTS DÉCLARÉS EN COMPLÉMENT — tâches assumées : ${tachesTxt} ; charge ressentie : ${chargeTxt}.
RÉCIT LIBRE DE L'AIDANT : "${AID.recit||"(non renseigné)"}"
${reponsesTxt?"PRÉCISIONS COMPLÉMENTAIRES :\n"+reponsesTxt:""}

1) À partir de ces profils, déduis les besoins d'accompagnement les plus pertinents pour soulager l'aidant et soutenir le proche, en tenant compte des contraintes (travail posté, faible flexibilité, absence de relais, isolement, fatigue, troubles cognitifs, risques…).
CONTRAINTE ABSOLUE : chaque besoin doit utiliser un identifiant EXACT parmi : ${taxoTxt}. N'invente aucune catégorie.
2) Propose des "relances" douces : une information utile manquante à compléter ou une question ciblée, en t'appuyant sur les profils et le récit.

Réponds UNIQUEMENT en JSON, sans texte autour :
{"besoins":[{"categorie":"<id>","horizon":<3|6|9|12>,"justification":"<phrase courte>"}],
 "relances":[{"type":"champ|question","texte":"<phrase courte>"}]}
Maximum 5 besoins (du plus urgent au moins urgent) et 3 relances.`;
  try{
    const res=await api("POST","/api/anticiper2",{prompt});
    if(!res || res.text==null) throw new Error("indispo");
    const parsed=JSON.parse(String(res.text).replace(/```json|```/g,"").trim());
    const bs=(parsed.besoins||[]).filter(b=>A_TAXO_IDS.includes(b.categorie)).slice(0,5);
    if(!bs.length) throw new Error("empty");
    AID.besoins=bs; AID.relances=(parsed.relances||[]).slice(0,3);
    AID.aiNote={kind:"ok",txt:"Besoins générés par le LLM à partir du socle et de votre récit, filtrés sur le catalogue aidance-pro."};
  }catch(e){
    AID.besoins=[
      {categorie:"assistance_administrative",horizon:3,justification:"Mise à jour des droits (dossier MDPH) en vue du déménagement."},
      {categorie:"logement_social",horizon:6,justification:"Constitution d'un dossier de logement adapté."},
      {categorie:"logement_adaptation",horizon:9,justification:"Évaluation ergothérapique du futur logement."},
      {categorie:"accompagnement_independance",horizon:12,justification:"Accompagnement vers l'autonomie au quotidien."},
    ];
    AID.relances=[
      {type:"question",texte:"Vous arrive-t-il d'avoir des nuits difficiles ? Cela ouvrirait des solutions de répit."},
      {type:"champ",texte:"Le logement visé est-il déjà identifié, et est-il adapté ?"},
    ];
    AID.aiNote={kind:"warn",txt:"Appel LLM indisponible ici — exemple de résultat affiché (repli). Posez ANTHROPIC_API_KEY pour activer le LLM."};
  }finally{ AID.loading=false; render(); }
}

function aidCatalogue(a){
  const ok=!!a.pmv_pret;
  const f=AID.cat;

  const results=rows.filter(r=>{
    if(f.famille && !r.familles.includes(f.famille)) return false;

    if(f.modalite && !r.mod.includes(f.modalite)) return false;
    if(f.dept){ const ok=r.mod.includes("distanciel")||r.nat||r.deps.includes(f.dept); if(!ok) return false; }
    return true;
  }).sort((x,y)=> x.rank-y.rank || ((x.prix==null?1e9:x.prix)-(y.prix==null?1e9:y.prix)));
  const active=f.famille||f.metier||f.modalite||f.dept;
  const famBtns=A_famillesList().map(x=>{const on=f.famille===x;return `<button class="chip" data-act="a-fam" data-v="${esc(x)}" style="cursor:pointer;padding:8px 13px;font-weight:600;font-size:12.5px;border:1px solid ${on?'var(--purple)':'var(--line)'};background:${on?'var(--purple)':'#fff'};color:${on?'#fff':'var(--ink)'}">${esc(x)}</button>`;}).join("");
  const modBtns=Object.entries(A_MOD).map(([k,lab])=>{const on=f.modalite===k;return `<button class="chip" data-act="a-mod" data-v="${k}" style="cursor:pointer;padding:9px 11px;font-weight:600;font-size:12px;border:1px solid ${on?'var(--teal)':'var(--line)'};background:${on?'var(--tealLt)':'#fff'};color:${on?'var(--teal)':'var(--muted)'}">${esc(lab)}</button>`;}).join("");
  const proAgg={};
  rows.forEach(r=>{ const p=proAgg[r.pro_id]||(proAgg[r.pro_id]={n:0,metiers:new Set(),familles:new Set(),mod:new Set(),nat:false,deps:new Set(),min:null,max:null});
    p.n++; r.metiers.forEach(x=>p.metiers.add(x)); r.familles.forEach(x=>p.familles.add(x)); r.mod.forEach(x=>p.mod.add(x));
    if(r.nat) p.nat=true; r.deps.forEach(x=>p.deps.add(x));
    const px=Number(r.prix); if(px){ p.min=p.min==null?px:Math.min(p.min,px); p.max=p.max==null?px:Math.max(p.max,px); } });
  const proTip=r=>{ const p=proAgg[r.pro_id]; if(!p) return "";

    const fams=[...p.familles]; const famTxt=esc(fams.slice(0,4).join(", "))+(fams.length>4?` +${fams.length-4}`:"");
    const modTxt=[...p.mod].map(m=>esc(A_MOD[m]||m)).join(" · ");

    const prix=p.min!=null?(p.min===p.max?eur(p.min):`${eur(p.min)} – ${eur(p.max)}`):"";
    return `<span class="ptip-box"><div style="font-weight:800;font-size:13px">${esc(r.pro)}</div>
      ${li("Métier :",esc([...p.metiers].join(", ")))}${li("Domaines :",famTxt)}${li("Modalités :",modTxt)}
      ${li("Couverture :",esc(couv))}${li("Au catalogue :",`${p.n} prestation${p.n>1?"s":""}${prix?` (${prix})`:""}`)}</span>`; };
  const cards=results.map(r=>{
    const l=A_LBL[r.rank]||A_LBL[2];
    const open=AID.demandePid===r.id;
    const btn = open
      ? `<div style="margin-top:11px;border-top:1px solid var(--line);padding-top:10px">

             <button class="btn teal" data-act="a-demander-envoyer" data-pid="${esc(r.id)}" style="flex:1;font-size:13px">Envoyer la demande</button>
             <button class="btn ghost" data-act="a-demander-devis" data-pid="${esc(r.id)}" style="flex:0 0 auto">Annuler</button>
           </div></div>`
      : `<button class="btn teal" data-act="a-demander-devis" data-pid="${esc(r.id)}" ${ok?'':'disabled'} style="margin-top:11px;width:100%;font-size:13px${ok?'':';background:var(--muted)'}">${ok?'Demander un devis':'🔒 PMV à activer'}</button>`;

function aidSeed(){ return {
  tab:"accueil", boundTo:null, taches:[], charge:[],
  recit:"", consent:false, loading:false, aiNote:null, besoins:[], relances:[], reponses:{}, parcours:[],
  cat:{famille:"",metier:"",modalite:"",dept:""}, demandePid:null,
  profilEdit:false, pfdEdit:null, pfdAddOpen:false,
  analyseTexte:"", analyseEdit:false, analyseLoading:false,
  justif:null, contesteId:null, catTitre:"",
  baroTexte:"", baroLoading:false, baroDim:null,
}; }
let AID = aidSeed();

function aidCur(){ return (STATE.assures||[]).find(x=>x.id===AIDANT_ID)||null; }
function aidDevisDe(a){ return (STATE.devis||[]).filter(d=>d.assure_id===a.id); }
function aidRembDe(a){ return (STATE.remboursements||[]).filter(r=>r.assure_id===a.id); }

function joursRestants(iso){
  if(!iso) return null;
  const e=new Date(iso+"T23:59:59"), n=new Date();
  return Math.ceil((e-n)/86400000);
}

const ETAT_PMV_CHIP={
  utilisable:["PMV utilisable","var(--good)","#E5F2EB"],
  verrou_rib:["Verrouillé — RIB","var(--goldDk)","var(--goldLt)"],

};

function viewAidant(){
  const assures=STATE.assures||[];
  if(!assures.length) return `<div class="card empty">Aucun dossier. Le gestionnaire doit pré-inscrire un assuré-aidant (F-20).</div>`;
  let a=aidCur(); if(!a){ a=assures[0]; AIDANT_ID=a.id; }
  if(AID.boundTo!==a.id){ const t=AID.tab; AID=aidSeed(); AID.tab=t; AID.boundTo=a.id; }
  const ch=ETAT_PMV_CHIP[a.pmv_etat]||ETAT_PMV_CHIP.utilisable;
  const sel=`<select class="in" id="sel-aidant" style="flex:0 1 330px;font-weight:700">
    ${assures.map(x=>`<option value="${esc(x.id)}" ${x.id===a.id?'selected':''}>${esc(x.id)} — ${esc(x.nom_complet)}</option>`).join("")}</select>`;
  const dosbar=`<div class="dosbar">
    <span class="num">Dossier ${esc(a.id)}</span>
    <span class="chip" style="color:${ch[1]};background:${ch[2]}">${ch[0]}</span>
    <span style="font-size:11.5px;opacity:.85">N° à communiquer aux professionnels — il figure sur leurs factures (${esc((STATE.parametres||{}).email_gestion||"")}).</span>
    <button class="btn gold" data-act="a-contact-open" style="margin-left:auto">💬 Contacter un conseiller</button>
  </div>`;
  const nbActions=aidActionsPrioritaires(a).length;
  const tabs=`<div style="display:flex;gap:8px;margin:2px 0 16px;flex-wrap:wrap">
    ${[["accueil","Accueil"],["fiche","Ma situation"],["trouver","Trouver un pro"],["prestations","Prestations"],["pmv","Mon PMV & remboursements"],["dossier","Dossier"]].map(([id,lab])=>{
      const on=AID.tab===id;
      const n=id==="accueil"?nbActions:0;
      return `<button class="btn ${on?'teal':'ghost'}" data-act="a-tab" data-tab="${id}">${lab}${n>0?`<span class="nbadge">${n}</span>`:""}</button>`;
    }).join("")}</div>`;
  let panel;
  if(AID.tab==="fiche") panel=aidFiche();
  else if(AID.tab==="trouver") panel=aidCatalogue(a);
  else if(AID.tab==="prestations") panel=aidPrestations(a);
  else if(AID.tab==="pmv") panel=aidPmvRemb(a);
  else if(AID.tab==="dossier") panel=aidDossier(a);
  else panel=aidAccueil(a);
  const demo=`<div class="muted" style="font-size:11px;margin-bottom:8px">Démo : choisissez le dossier ${sel.replace('class="in"','class="in" style="display:inline-block;width:330px;font-weight:700;padding:5px 8px;font-size:12px"')} — en production, chacun accède au sien par son lien d'activation personnel (F-40).</div>`;
  return `<div style="max-width:980px;margin:0 auto">${demo}${dosbar}${tabs}${panel}</div>`;
}


/* — Mon baromètre aidant : global 3 zones + 6 dimensions (charge d'aide,
     charge mentale, santé & répit, vie pro, entourage, budget & droits),
     calculé sur les profils ET les signaux d'usage du PMV ; lecture par
     l'assistant. Repère indicatif, jamais un diagnostic. — */
const BARO_Z={vert:["#2E7D5B","#E5F2EB"],orange:["#C98A2D","#FCF3E2"],rouge:["#C0492F","#FBEDEC"]};
function baroGauge(m){
  const H=176,W=206,x=56,w=28,top=12;           // thermomètre global : rouge en haut
  const segs=[["rouge",0,0.40,"Me protéger"],["orange",0.40,0.70,"Demander de l'aide"],["vert",0.70,1,"Se renseigner"]];
  const y=s=>top+(1-s/100)*H;
  const rects=segs.map(([z,a,b])=>`<rect x="${x}" y="${top+a*H}" width="${w}" height="${(b-a)*H-3}" rx="8" fill="${BARO_Z[z][0]}"/>`).join("");
  const labels=segs.map(([z,a,b,lab])=>`<text x="${x+w+9}" y="${top+(a+b)/2*H+4}" font-size="10.5" font-weight="${z===m.zone?800:500}" fill="${z===m.zone?'var(--ink)':'var(--muted)'}">${lab}${z===m.zone?" ◂":""}</text>`).join("");
  const cy=y(m.score);
  return `<svg width="${W}" height="${H+40}" viewBox="0 0 ${W} ${H+40}" role="img" aria-label="Baromètre aidant : ${m.score} sur 100, zone ${m.zone}">
    ${rects}
    <circle cx="${x+w/2}" cy="${top+H+11}" r="14" fill="${BARO_Z[m.zone][0]}"/>
    <circle cx="${x+w/2}" cy="${top+H+11}" r="14" fill="none" stroke="#fff" stroke-width="2.5"/>
    ${labels}
    <text x="${x-22}" y="${cy+5}" font-size="16" font-weight="800" fill="var(--ink)" text-anchor="end">${m.score}</text>
    <polygon points="${x-3},${cy} ${x-15},${cy-7} ${x-15},${cy+7}" fill="var(--ink)"/>
    <line x1="${x-1}" y1="${cy}" x2="${x+w+3}" y2="${cy}" stroke="var(--ink)" stroke-width="2.5"/>
  </svg>`;
}
function baroMini(d){
  if(d.na) return `<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;opacity:.5">
    <span style="flex:0 0 150px;font-size:12px;font-weight:600">${esc(d.libelle)}</span>
    <span class="muted" style="font-size:11px">non concerné(e)</span></div>`;
  const W=130,hbar=10;
  const px=s=>Math.round(s/100*W);
  const open=AID.baroDim===d.id;
  const chips=(arr,pre,color,bgc)=>arr.map(t=>`<span class="chip" style="color:${color};background:${bgc};font-weight:600">${pre} ${esc(t)}</span>`).join(" ");
  const detail=open?`<div style="padding:4px 10px 10px 170px;display:flex;gap:5px;flex-wrap:wrap">
      ${chips(d.pese,"▲","var(--goldDk)","var(--goldLt)")}${chips(d.appuis,"▽","var(--good)","var(--tealLt)")}
      ${(!d.pese.length&&!d.appuis.length)?'<span class="muted" style="font-size:11px">Rien de notable.</span>':""}</div>`:"";
  return `<div>
    <button data-act="a-baro-dim" data-id="${esc(d.id)}" style="display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:none;border-radius:10px;background:${open?'var(--paper)':'transparent'};cursor:pointer;text-align:left;font-family:inherit">
      <span style="flex:0 0 150px;font-size:12px;font-weight:700;color:var(--ink)">${esc(d.libelle)}</span>
      <svg width="${W}" height="${hbar+8}" style="flex:0 0 auto">
        <rect x="0" y="4" width="${W*.3}" height="${hbar}" rx="5" fill="#2E7D5B" opacity=".35"/>
        <rect x="${W*.3}" y="4" width="${W*.3}" height="${hbar}" rx="0" fill="#C98A2D" opacity=".35"/>
        <rect x="${W*.6}" y="4" width="${W*.4}" height="${hbar}" rx="5" fill="#C0492F" opacity=".35"/>
        <line x1="${px(d.score)}" y1="0" x2="${px(d.score)}" y2="${hbar+8}" stroke="${BARO_Z[d.zone][0]}" stroke-width="3.5"/>
      </svg>
      <span style="flex:0 0 30px;font-size:12.5px;font-weight:800;color:${BARO_Z[d.zone][0]};text-align:right">${d.score}</span>
      <span class="muted" style="font-size:10px">${open?"▴":"▾"}</span>
    </button>${detail}</div>`;
}
function baroCard(a){
  const m=a.barometre;
  if(!m) return `<div class="card"><h2>Mon baromètre aidant <span class="sub">— où en êtes-vous, sujet par sujet ?</span></h2>
    <div class="muted" style="font-size:12.5px">Complétez votre profil (écran « Dossier ») pour afficher votre positionnement. Il se construit uniquement à partir de vos réponses — rien de plus à saisir.</div></div>`;

        <div style="font-size:11.5px;line-height:1.45;margin-top:6px;color:var(--ink)">${esc(m.action)}</div></div>
      </div>
      <div style="flex:1 1 330px">
        <div style="display:grid;gap:2px">${m.dimensions.map(baroMini).join("")}</div>
        ${lecture}${conseiller}
        <div class="muted" style="font-size:10.5px;margin-top:10px;line-height:1.5">Repère indicatif établi à partir de vos déclarations${m.pfd_profil?"":" (complétez le profil de votre proche pour l'affiner)"} — ce n'est pas un avis médical. ${m.usage&&m.usage.nb_services?`Il intègre l'usage de votre PMV (${m.usage.nb_services} service(s) mobilisé(s)${m.usage.nb_rembourses?`, ${m.usage.nb_rembourses} remboursement(s)`:""}) et s'affinera à chaque nouvelle étape.`:"Il s'affinera avec l'usage de votre PMV (services mobilisés, remboursements)."}</div>
      </div></div></div>`;
}

async function baroLecture(){
  const a=aidCur(); if(!a||!a.barometre) return;
  const m=a.barometre;
  AID.baroLoading=true; render();
  const dimsTxt=m.dimensions.filter(d=>!d.na).map(d=>`- ${d.libelle} : ${d.score}/100 (${d.zone})
    pèse : ${d.pese.join(" ; ")||"—"}
    appuis : ${d.appuis.join(" ; ")||"—"}`).join("\n");
  const prompt=`BAROMÈTRE AIDANT — global : ${m.score}/100, zone ${m.zone} (${m.titre}).
Dimensions :
${dimsTxt}

PROFIL DE L'AIDANT :
${profilAidantTxt(a.profil)}

PROFIL DU PROCHE :
${profilPfdTxt(a.aides||[])}

Rédige la lecture demandée (4 phrases maximum).`;
  try{
    const r=await api("POST","/api/barometre",{prompt});
    if(!r||r.texte==null) throw new Error("repli");
    AID.baroTexte=String(r.texte).trim();
  }catch(_){
    const actifs=m.dimensions.filter(d=>!d.na);
    const top=actifs.slice().sort((x,y)=>y.score-x.score)[0];
    const deb={vert:"Votre situation d'aidant apparaît aujourd'hui équilibrée.",
      orange:"Votre rôle d'aidant pèse réellement sur votre quotidien.",
      rouge:"Votre situation d'aidant est lourde et vous expose."}[m.zone];
    const dim=top?` Le point le plus en tension : ${top.libelle.toLowerCase()} (${top.score}/100${top.pese.length?` — ${top.pese[0].toLowerCase()}`:""}).`:"";
    const appui=(top&&top.appuis.length)?` Appuyez-vous sur ce qui existe déjà : ${top.appuis[0].toLowerCase()}.`:"";
    const pas={vert:" C'est le bon moment pour vous renseigner et anticiper la suite.",
      orange:" Parlez-en à un conseiller : des solutions de répit et d'appui existent, votre PMV est là pour ça.",
      rouge:" Demandez de l'aide sans attendre — contactez votre conseiller : prendre soin de vous fait partie de l'aide."}[m.zone];
    AID.baroTexte=deb+dim+appui+pas+" (Lecture type — l'assistant IA n'était pas disponible.)";
  }
  AID.baroLoading=false; render();
}

/* — Accueil : actions prioritaires, catégories retenues, PMV en bref (F-40, F-46, F-50) — */
function aidActionsPrioritaires(a){
  const out=[];
  if(a.pmv_etat==="verrou_rib")
    out.push({txt:"Complétez votre profil et votre RIB pour activer votre PMV (étape 1/2).",btn:"Compléter mon profil",tab:"dossier"});
  else if(a.pmv_etat==="verrou_pfd")
    out.push({txt:"Complétez le profil de votre proche pour activer votre PMV (étape 2/2).",btn:"Compléter le profil du proche",tab:"dossier"});
  for(const d of aidDevisDe(a)){
    const p=(STATE.prestations||[]).find(x=>x.id===d.prestation_id)||{};
    if(d.statut==="devisé")
      out.push({txt:`Devis ${d.id.split("-").pop()} reçu — « ${p.nom} » : ${eur(d.total)} à accepter ou refuser.`,btn:"Voir le devis",tab:"prestations"});
    if(d.statut==="réalisée"&&!d.service_fait){
      const j=joursRestants(d.echeance_confirmation);
      out.push({txt:`« ${p.nom} » déclarée réalisée — confirmez le service fait${j!=null?(j>=0?` (${j} j restants)`:" (délai expiré — le gestionnaire va vous contacter)"):""}.`,btn:"Confirmer / contester",tab:"prestations"});
    }
  }
  for(const r of aidRembDe(a)) if(r.statut==="piece_demandee")
    out.push({txt:`Remboursement « ${r.libelle} » : une pièce complémentaire est demandée.`,btn:"Déposer la pièce",tab:"pmv"});
  if(!a.analyse && a.pmv_etat==="utilisable")
    out.push({txt:"Faites le point sur votre situation : bilan et évaluation de vos besoins par l'assistant.",btn:"Ma situation",tab:"fiche"});
  return out;
}

  const parcours=AID.parcours.length?`<div class="card">
      <h2>Mon parcours <span class="sub">— vos catégories d'aide retenues (F-45) : la liste complète des professionnels pour chacune</span></h2>
      <div style="display:grid;gap:8px">${AID.parcours.map(b=>`<button class="btn" data-act="a-parcours-pro" data-cat="${esc(b.categorie)}" style="display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:11px;border:1px solid var(--teal);background:var(--tealLt);color:var(--ink);font-weight:500">
        <span style="display:flex;align-items:center;gap:9px"><span style="color:var(--teal)">✓</span><span style="font-weight:700;font-size:13.5px">${esc(A_TAXO_LABEL(b.categorie))}</span><span class="muted" style="font-size:11px">· horizon ${b.horizon} mois</span></span>
        <span style="color:var(--teal);font-weight:700;font-size:12.5px">Voir les professionnels ›</span></button>`).join("")}</div></div>`
    :`<div class="card"><h2>Mon parcours</h2><div class="muted" style="font-size:12.5px">Aucune catégorie retenue pour le moment. Passez par « Ma situation » pour évaluer vos besoins — ou consultez librement le catalogue dans « Trouver un pro ».</div>

  return `${bloc}${actions}${baroCard(a)}${parcours}
    <div class="card"><h2>Mon PMV en bref <span class="sub">— détail et historique dans « Mon PMV & remboursements »</span></h2>${pmvStrip5(a.pmv,true)}</div>`;
}

/* — Prestations : fil d'avancement par devis, service fait / contestation (F-49, F-50) — */
function aidPrestations(a){
  const ds=aidDevisDe(a);
  if(!ds.length) return `<div class="card empty">Aucune prestation pour le moment. Passez par « Trouver un pro » pour demander un devis.</div>`;
  const delai=(STATE.parametres||{}).delai_confirmation_jours||7;
  const cards=ds.slice().reverse().map(d=>{
    const p=(STATE.prestations||[]).find(x=>x.id===d.prestation_id)||{};
    const proNom=A_proNom(d.pro_id);
    let statusLine="", actions="";
    if(d.statut==="demande") statusLine=`En attente du chiffrage du professionnel.`;
    else if(d.statut==="devisé"){
      statusLine=`Devis reçu : <b>${eur(d.total)}</b>${d.quantite?` (${d.quantite} × ${eur(p.prix)})`:""}. L'accepter <b>engage immédiatement</b> ce montant sur votre PMV (RG-51).`;
      actions=a.pmv_etat==="bloque"?`<div class="muted" style="font-size:12px">PMV bloqué — acceptation impossible.</div>`
        :`<button class="btn teal" data-act="a-dv-accepter" data-id="${esc(d.id)}">Accepter (${eur(d.total)})</button>
          <button class="btn ghost" data-act="a-dv-refuser" data-id="${esc(d.id)}">Refuser</button>`;
    }
    else if(d.statut==="engagé") statusLine=`<b>${eur(d.total)}</b> engagés sur votre PMV — prestation à réaliser par ${esc(proNom)}.`;
    else if(d.statut==="réalisée"&&!d.service_fait){
      const j=joursRestants(d.echeance_confirmation);
      statusLine=`Le professionnel a déclaré la prestation réalisée le ${dateFR(d.date_realisee)}. Confirmez le service fait ou contestez avant le <b>${dateFR(d.echeance_confirmation)}</b>${j!=null?(j>=0?` (${j} j restants sur ${delai})`:" — <b style='color:var(--bad)'>délai expiré, le gestionnaire est alerté</b>"):""}. La confirmation ne déclenche aucun paiement automatique : elle signale au gestionnaire que le paiement peut être effectué (F-49).`;
      actions = AID.contesteId===d.id
        ? `<div style="width:100%"><label style="font-size:11px;font-weight:700;color:var(--muted)">Pourquoi contestez-vous ? (non réalisée / incomplète)</label>
           <textarea class="in" id="a-conteste-motif" rows="2" style="margin-top:4px;resize:vertical" placeholder="ex. Seules 2 heures sur 4 ont été assurées."></textarea>
           <div class="row" style="margin-top:8px"><button class="btn bad" data-act="a-dv-contester" data-id="${esc(d.id)}">Envoyer la contestation</button>
           <button class="btn ghost" data-act="a-conteste-toggle" data-id="">Annuler</button></div></div>`
        : `<button class="btn teal" data-act="a-dv-servicefait" data-id="${esc(d.id)}">✓ Confirmer le service fait</button>
           <button class="btn ghost" data-act="a-conteste-toggle" data-id="${esc(d.id)}">Contester</button>`;
    }
    else if(d.statut==="réalisée"&&d.service_fait)
      statusLine=`Service fait confirmé (${esc(d.confirme_par||"assuré-aidant")}). <b>En attente du paiement par le gestionnaire</b> — vous serez notifié par e-mail (F-24).`;
    else if(d.statut==="payé"){
      const partiel=d.montant_paye&&Number(d.montant_paye)<Number(d.total);
      statusLine=`Payé ${eur(d.montant_paye)} au professionnel le ${dateFR(d.date_paiement)}${partiel?` — paiement partiel, ${eur(Number(d.total)-Number(d.montant_paye))} recrédités sur votre disponible`:""}.${d.commentaire_paiement?` <span class="muted">« ${esc(d.commentaire_paiement)} »</span>`:""}`;
    }
    return `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <div><div style="font-weight:800;font-size:14px">${esc(p.nom||d.prestation_id)} <span class="muted" style="font-weight:500;font-size:11.5px">· ${esc(d.id)}</span></div>
          <div class="muted" style="font-size:12px">${esc(proNom)}${d.total?` · ${eur(d.total)}`:""}</div></div>
      </div>
      ${dvStepper(d)}
      ${statusLine?`<div style="font-size:12.5px;line-height:1.5;margin-bottom:8px">${statusLine}</div>`:""}
      ${dvMsg("Votre message",d.message,"var(--teal)")}
      ${dvMsg("Mot du pro",d.message_pro,"var(--purple)")}
      ${actions?`<div class="row" style="margin-top:10px">${actions}</div>`:""}
    </div>`;
  }).join("");
  return `<div style="max-width:860px;margin:0 auto">${cards}</div>`;
}

/* ───── File des paiements (F-22) : virement hors outil, puis saisie, en lot ───── */
function gPaiements(){
  const devis=(STATE.devis||[]).filter(d=>d.statut==="réalisée"&&d.service_fait);
  const rembs=(STATE.remboursements||[]).filter(r=>r.statut==="validée");
  const nSel=Object.values(GEST.selPay).filter(Boolean).length;
  const rappel=`<div class="card" style="background:var(--blueLt);border-color:var(--blue);font-size:12.5px;line-height:1.5">
    <b>Le paiement est un acte manuel (RG-52), en deux temps.</b> ① Cochez les lignes et « Marquer payés » :
    le PMV passe d'engagé à payé, l'assuré-aidant est notifié (F-24) et MPA <b>génère le bordereau de
    virement, groupé par bénéficiaire</b>. ② Exécutez le bordereau à votre banque (hors outil), puis
    marquez-le exécuté ci-dessous. Paiement partiel possible ligne à ligne (montant ≤ engagé — RG-53 ;
    le reliquat retourne au disponible).</div>`;
  /* ── groupes par bénéficiaire : les pros (devis), puis les assurés (remboursements) ── */
  const grps=[];
  devis.forEach(d=>{const k="pro:"+d.pro_id;let g=grps.find(x=>x.k===k);
    if(!g){g={k,nom:A_proNom(d.pro_id),type:"Professionnel — coordonnées bancaires sur facture (F-62)",lignes:[]};grps.push(g);}
    const p=P_presta(d.prestation_id);
    g.lignes.push({ref:d.id,dossier:d.assure_id,assure:gAssure(d.assure_id).nom_complet,lib:p.nom||"",montant:Number(d.total),partiel:true});});
  rembs.forEach(r=>{const k="aid:"+r.assure_id;let g=grps.find(x=>x.k===k);
    const a=gAssure(r.assure_id);
    if(!g){g={k,nom:a.nom_complet+" (assuré-aidant)",type:"Remboursement — IBAN du dossier "+r.assure_id,lignes:[]};grps.push(g);}
    g.lignes.push({ref:r.id,dossier:r.assure_id,assure:a.nom_complet,lib:r.libelle+(r.partiel?" (validation partielle)":""),montant:Number(r.montant_valide),partiel:false});});
  const file=!grps.length?`<div class="card empty">File vide : aucun service fait confirmé ni remboursement validé en attente de paiement.</div>`
  :`<div class="card" style="padding:0;overflow:hidden">

      <button class="btn blue" data-act="g-payer-lot" ${nSel?'':'disabled'}>Marquer payés (${nSel}) → bordereau</button></div>
    ${grps.map(g=>{
      const refs=g.lignes.map(l=>l.ref), tout=refs.every(r=>GEST.selPay[r]);
      const sousTotal=g.lignes.reduce((t,l)=>t+l.montant,0);
      return `<div style="border-bottom:1px solid var(--line)">
        <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--paper);flex-wrap:wrap">
          <input type="checkbox" data-paygrp="${esc(refs.join(","))}" ${tout?'checked':''} title="Tout le bénéficiaire">
          <div style="flex:1;min-width:200px"><b style="font-size:13px">${esc(g.nom)}</b>
            <div class="muted" style="font-size:10.5px">${esc(g.type)}</div></div>
          <span style="font-weight:800;white-space:nowrap">${eur(sousTotal)}</span></div>
        ${g.lignes.map(l=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 16px 8px 34px;font-size:12.5px;flex-wrap:wrap">
          <input type="checkbox" data-pay="${esc(l.ref)}" ${GEST.selPay[l.ref]?'checked':''}>
          <b style="font-size:11.5px;white-space:nowrap">${esc(l.ref)}</b>
          <span style="flex:1;min-width:160px">${esc(l.lib)}<span class="muted" style="font-size:10.5px"> · ${esc(l.assure)} — ${esc(l.dossier)}</span></span>
          <span style="font-weight:800;white-space:nowrap">${eur(l.montant)}</span>
          ${l.partiel?`<button class="btn ghost" data-act="g-partiel-open" data-id="${esc(l.ref)}" style="padding:4px 9px;font-size:11px">Partiel…</button>`:`<span style="width:58px"></span>`}
        </div>`).join("")}</div>`;}).join("")}</div>`;
  /* ── bordereaux de virement (RG-52) ── */
  const brds=STATE.bordereaux||[];
  const bloc=b=>{
    const open=GEST.brdOpen===b.id;
    const benefs=[...new Set(b.lignes.map(l=>l.beneficiaire))];
    const aExec=b.statut==="à exécuter";
    let detail="";
    if(open){
      detail=benefs.map(nom=>{
        const ls=b.lignes.filter(l=>l.beneficiaire===nom);
        const st=ls.reduce((t,l)=>t+Number(l.montant),0);
        return `<div style="margin-top:9px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff">
          <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b style="font-size:12.5px">${esc(nom)}</b><b>${eur(st)}</b></div>
          <div class="muted" style="font-size:11px;margin:2px 0 6px">${esc(ls[0].iban)}</div>
          ${ls.map(l=>`<div style="display:flex;gap:8px;font-size:11.5px;padding:2px 0"><span style="font-weight:700">${esc(l.ref)}</span><span class="muted" style="flex:1">dossier ${esc(l.dossier)}</span><span>${eur(l.montant)}</span></div>`).join("")}
        </div>`;}).join("")
      +`<div style="display:flex;justify-content:flex-end;margin-top:8px;font-size:13px"><b>Total du bordereau : ${eur(b.total)}</b></div>`;
    }
    return `<div class="card" style="margin-bottom:8px;${aExec?'border-color:var(--goldDk)':''}">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="font-size:13px">${esc(b.id)}</b><span class="muted" style="font-size:11.5px">du ${dateFR(b.date)}</span>
        <span style="flex:1;font-size:11.5px" class="muted">${benefs.length} bénéficiaire(s) · ${b.lignes.length} ligne(s)</span>
        <b style="white-space:nowrap">${eur(b.total)}</b>
        <span class="chip" style="${aExec?'background:var(--goldLt);color:var(--goldDk)':'background:var(--tealLt);color:var(--teal)'}">${aExec?'À exécuter à la banque':'Exécuté le '+dateFR(b.date_execution)}</span>
        <button class="btn ghost" data-act="g-brd-toggle" data-id="${esc(b.id)}" style="padding:4px 10px;font-size:11.5px">${open?'Replier':'Détail'}</button>
        ${aExec?`<button class="btn teal" data-act="g-brd-executer" data-id="${esc(b.id)}" style="padding:4px 10px;font-size:11.5px">Marquer exécuté</button>`:""}
      </div>${detail}</div>`;};
  const blocBrds=`<div style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;flex-wrap:wrap;gap:8px">
      <div style="font-size:12px;font-weight:700;color:var(--muted)">BORDEREAUX DE VIREMENT — à exécuter à la banque, puis à marquer exécutés</div>
      <a class="btn ghost" style="padding:5px 10px;font-size:11.5px;text-decoration:none" href="${API}/api/exports/bordereaux.csv" download>⬇ Export CSV</a></div>`
    +(brds.length?brds.map(bloc).join(""):`<div class="card empty" style="padding:14px">Aucun bordereau — généré automatiquement au marquage « payé ».</div>`);
  return rappel+file+blocBrds;
}

/* ───── Demandes de remboursement (F-23) : INSTRUCTION, groupée par dossier.
   Une demande validée engage le PMV (RG-44) et bascule dans « Paiements à
   effectuer » ; payées / refusées : historique replié. ───── */
function gRemboursements(){
  const aTraiter=(STATE.remboursements||[]).filter(r=>r.statut==="soumise"||r.statut==="piece_demandee");
  const validees=(STATE.remboursements||[]).filter(r=>r.statut==="validée");
  const closes=(STATE.remboursements||[]).filter(r=>["payée","refusée"].includes(r.statut));
  const rappel=`<div class="card" style="background:var(--blueLt);border-color:var(--blue);font-size:12.5px;line-height:1.5">
    <b>Instruction des demandes (F-23).</b> Valider engage le montant sur le PMV — au plus à hauteur du
    disponible (partiel automatique, RG-44) — et envoie la demande dans <b>« Paiements à effectuer »</b>.
    Refus et demande de pièce sont notifiés à l'assuré-aidant (F-24).</div>`;
  const lienValidees=validees.length?`<div class="card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--tealLt);border-color:var(--teal)">
    <span style="font-size:12.5px;flex:1"><b>${validees.length} demande(s) validée(s)</b> en attente de virement (${eur(validees.reduce((t,r)=>t+Number(r.montant_valide),0))}).</span>
    <button class="btn teal" data-act="g-tab" data-tab="paiements" style="padding:6px 12px;font-size:12px">→ Paiements à effectuer</button></div>`:"";
  const carte=r=>`<div style="border-top:1px solid var(--line);padding:11px 14px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div><b style="font-size:13.5px">${esc(r.libelle)}</b> <span class="muted" style="font-size:11px">· ${esc(r.id)}</span>
          <div class="muted" style="font-size:12px">${esc(r.motif)} · demandé <b>${eur(r.montant)}</b></div></div>
        <span class="chip" style="background:${r.statut==='piece_demandee'?'var(--goldLt)':'var(--paper)'};color:${r.statut==='piece_demandee'?'var(--goldDk)':'var(--ink)'}">${r.statut==='piece_demandee'?'Pièce demandée':'À examiner'}</span></div>
      <div style="font-size:12px;margin-top:6px">Justificatif : ${r.a_justificatif
        ?`<a href="${API}/api/remboursements/${encodeURIComponent(r.id)}/justificatif" target="_blank" style="color:var(--blue);font-weight:700">${esc(r.justificatif_nom)} ↗</a>`
        :`<span class="muted">${esc(r.justificatif_nom||"—")} (nom seul — pièce non déposée)</span>`}</div>
      ${r.statut==="soumise"?`<div class="row" style="margin-top:10px">
        <button class="btn teal" data-act="g-remb-valider" data-id="${esc(r.id)}">Valider (partiel automatique — RG-44)</button>
        <button class="btn ghost" data-act="g-remb-piece" data-id="${esc(r.id)}">Demander une pièce</button>
        <button class="btn bad" data-act="g-remb-refuser-open" data-id="${esc(r.id)}">Refuser…</button></div>`
      :`<div class="muted" style="font-size:12px;margin-top:6px">En attente du nouveau dépôt par l'assuré-aidant (retour à « soumise »).</div>`}</div>`;
  /* ── regroupement par dossier, avec les chiffres du PMV en tête de groupe ── */
  const parDossier={};
  aTraiter.forEach(r=>{(parDossier[r.assure_id]=parDossier[r.assure_id]||[]).push(r);});
  const groupe=aid=>{
    const a=gAssure(aid), e=a.pmv, rs=parDossier[aid];
    const chip=(lab,val,col)=>`<span style="font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px 8px;white-space:nowrap">${lab} <b style="color:${col||'var(--ink)'}">${eur(val)}</b></span>`;
    return `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--paper);flex-wrap:wrap">
        <div style="flex:1;min-width:200px"><b style="font-size:13.5px">${esc(a.nom_complet)}</b>
          <span class="muted" style="font-size:11.5px">· ${esc(aid)}</span>
          ${a.etat_dossier==="Bloqué"?`<span class="chip" style="background:#FBEDEC;color:var(--bad);margin-left:6px">PMV bloqué</span>`:""}
          <div class="muted" style="font-size:10.5px">${rs.length} demande(s) à instruire</div></div>
        ${chip("Solde",e.solde)}${chip("Engagé",e.engage,"var(--purple)")}${chip("Disponible",e.disponible,"var(--teal)")}</div>
      ${rs.map(carte).join("")}</div>`;};
  const blocTraiter=aTraiter.length
    ?`<h2 style="margin:4px 0 10px">À instruire</h2>${Object.keys(parDossier).sort().map(groupe).join("")}`
    :`<div class="card empty" style="padding:16px">Aucune demande à instruire.</div>`;
  const blocCloses=closes.length?`<details style="margin-top:16px"><summary style="font-size:12px;font-weight:700;color:var(--muted);cursor:pointer">DEMANDES TRAITÉES (${closes.length})</summary>
    <div style="display:grid;gap:5px;margin-top:8px">${closes.slice().reverse().map(r=>`<div style="display:flex;gap:9px;align-items:center;font-size:12px;padding:7px 11px;border-radius:9px;background:var(--paper);flex-wrap:wrap">
      <b>${esc(r.id)}</b><span class="muted" style="font-size:11px">${esc(gAssure(r.assure_id).nom_complet)}</span><span style="flex:1">${esc(r.libelle)}</span><span>${eur(r.montant_valide!=null?r.montant_valide:r.montant)}</span>
      <span class="chip" style="background:var(--line)">${esc(r.statut)}${r.date_paiement?' le '+dateFR(r.date_paiement):''}${r.bordereau_id?' · '+esc(r.bordereau_id):''}</span></div>`).join("")}</div></details>`:"";
  return rappel+lienValidees+blocTraiter+blocCloses;
}

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="chip" style="color:#fff;background:${x.type==='contestation'?'var(--bad)':'var(--goldDk)'}">${x.type==='contestation'?'Contestation':'Délai expiré'}</span>
        <b style="font-size:13.5px">${esc(x.devis_id)}</b><span class="muted" style="font-size:12px">· ${esc(p.nom||"")} · ${esc(gAssure(x.assure_id)?gAssure(x.assure_id).nom_complet:x.assure_id)} · engagé ${eur(d.total)}</span></div>
      <div style="font-size:12.5px;margin-top:6px">${esc(x.detail)}</div>

      </div></div>`;}).join("");
}

/* ───── E-mails simulés & Exports (F-24, F-28) ───── */
function emailCorps(t){
  return esc(t).replace(/(https?:\/\/[^\s]+|\?(?:pro|dossier)=[A-Za-z0-9_\-]+)/g, m=>{
    const href=m.indexOf("http")===0?m:(location.origin+location.pathname+m);
    return `<a href="${href}" target="_blank" rel="noopener" style="color:var(--teal);font-weight:700">${m}</a>`;});
}

function gEmails(){
  const ems=(GEST.emails||[]);
  if(!GEST.emailsLoaded) return `<div class="card empty">Chargement des e-mails… <button class="btn ghost" data-act="g-emails-load">Charger</button></div>`;
  if(!ems.length) return `<div class="card empty">Aucun e-mail émis.</div>`;
  return `<div class="muted" style="font-size:12px;margin-bottom:10px">Notifications adressées automatiquement (F-20, F-24, §4). <b>Simulation</b> : en production, envoi réel par le serveur.</div>
    <div style="display:grid;gap:7px">${ems.slice().reverse().map(e=>`<details class="card" style="margin-bottom:0;padding:12px 16px">
    <summary style="cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none">
      <span class="muted" style="font-size:11px;white-space:nowrap">${esc(e.date)}</span>
      <b style="font-size:12.5px;flex:1">${esc(e.objet)}</b>
      <span class="muted" style="font-size:11.5px">→ ${esc(e.a)}</span></summary>
    <pre style="margin-top:10px;max-height:180px;white-space:pre-wrap;font-size:11.5px">${emailCorps(e.corps)}</pre></details>`).join("")}</div>`;
}

function gExports(){
  const items=[["dossiers","Dossiers","n°, NDD, état, dates, les 5 soldes"],["mouvements","Mouvements PMV","journal complet, commentaires, auteurs"],
    ["devis","Devis","cycle complet, montants payés, échéances"],["remboursements","Remboursements","demandé/validé/partiel, dates de paiement"]];

/* ───── Modals gestionnaire ───── */

    const d=(STATE.devis||[]).find(v=>v.id===GM.ref)||{};
